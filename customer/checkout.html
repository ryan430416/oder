<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="checkout_title">結帳</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/customer.css" />
</head>
<body>
  <header class="topbar">
    <a class="btn btn-ghost" href="cart.html" data-i18n="back">返回</a>
    <h1 data-i18n="checkout_title">結帳</h1>
    <div class="topbar-actions">
      <div class="js-lang"></div>
      <a class="home-link" href="../index.html" data-i18n="home">首頁</a>
    </div>
  </header>
  <main class="wrap">
    <div id="checkoutStatus" hidden></div>
    <div class="card checkout-block">
      <label for="custName"><strong data-i18n="cust_name"></strong></label>
      <input id="custName" class="search" style="margin:10px 0 0" autocomplete="name" required />
      <label for="custGrade"><strong data-i18n="grade"></strong></label>
      <select id="custGrade" class="search" style="margin:10px 0 0" required>
        <option value="" data-i18n="grade_choose"></option>
        <option value="high_1" data-i18n="grade_high_1"></option>
        <option value="high_2" data-i18n="grade_high_2"></option>
        <option value="high_3" data-i18n="grade_high_3"></option>
      </select>
    </div>
    <div class="card checkout-block">
      <label for="pickup"><strong data-i18n="pickup_time">取餐時間</strong></label>
      <select id="pickup" class="search" style="margin:10px 0 0"></select>
    </div>
    <div class="card checkout-block">
      <label for="pay"><strong data-i18n="payment">付款方式</strong></label>
      <select id="pay" class="search" style="margin:10px 0 0">
        <option value="cash" data-i18n="pay_cash">現場付款（取餐時）</option>
        <option value="campus" data-i18n="pay_campus">校園儲值（示範）</option>
      </select>
    </div>
    <div class="card checkout-block" id="summary"></div>
    <button class="btn btn-block" id="confirm" type="button" disabled data-i18n="confirm_order">確認下單</button>
    <p class="muted" id="msg"></p>
  </main>
  <script type="module" src="../js/pages/customer-checkout.js"></script>
</body>
</html>
