<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="../css/reset.css" />

  <nav class="bottom-nav">
    <a href="index.html" data-i18n="nav_stores">店家</a>
