<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="partner_stores">合作店家</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/customer.css" />
</head>
<body>
  <header class="topbar">
    <h1><a href="../index.html" data-i18n="brand">校園點餐</a></h1>
    <div class="topbar-actions">
      <div class="js-lang"></div>
      <span id="bellHost"></span>
      <a class="cart-fab" href="cart.html" data-i18n-aria="nav_cart"><i data-lucide="shopping-cart"></i><span id="cartCount" class="cart-count" hidden>0</span></a>
      <a class="home-link" href="../index.html" data-i18n="home">首頁</a>
    </div>
  </header>
  <main class="wrap">
    <h2 class="page-title" data-i18n="partner_stores">合作店家</h2>
    <p class="sub" data-i18n="order_anytime">全天24小時可預訂，取餐僅限早餐／午餐／下午茶時段</p>
    <p class="sub" id="who"></p>
    <div class="card">
      <label for="custName" data-i18n="cust_name"></label>
      <div class="name-row">
        <input id="custName" autocomplete="name" />
      </div>
      <label for="custGrade" data-i18n="grade"></label>
      <div class="name-row">
        <select id="custGrade">
          <option value="" data-i18n="grade_choose"></option>
          <option value="high_1" data-i18n="grade_high_1"></option>
          <option value="high_2" data-i18n="grade_high_2"></option>
          <option value="high_3" data-i18n="grade_high_3"></option>
        </select>
        <button class="btn" type="button" id="saveName" data-i18n="save_profile"></button>
      </div>
      <p class="muted" id="nameMsg"></p>
    </div>
    <input class="search" id="search" type="search" data-i18n-placeholder="search_store" placeholder="搜尋店家名稱" />
    <div id="catalogStatus" hidden></div>
    <div class="grid" id="list"></div>
  </main>
  <nav class="bottom-nav">
    <a class="active" href="index.html" data-i18n="nav_stores">店家</a>
    <a href="cart.html" data-i18n="nav_cart">購物車</a>
    <a href="orders.html" data-i18n="nav_orders">訂單</a>
  </nav>
  <script type="module" src="../js/pages/customer-home.js"></script>
</body>
</html>
