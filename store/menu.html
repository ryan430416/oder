<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="menu_manage">菜單管理</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="menu_manage">菜單管理</h1>
    <div class="topbar-actions">
      <div class="js-lang"></div>
      <a class="home-link" href="../index.html" data-i18n="home">首頁</a>
    </div>
  </header>
  <main class="wrap">
    <p class="sub" data-i18n="menu_manage_sub"></p>
    <form class="card login-form" id="form">
      <input type="hidden" name="product_id" />
      <label data-i18n="form_product_name"></label>
      <input name="product_name" required />
      <label data-i18n="form_category"></label>
      <input name="category" />
      <label data-i18n="form_desc"></label>
      <textarea name="description" rows="2"></textarea>
      <label data-i18n="form_price"></label>
      <input name="price" type="number" min="0" step="1" required />
      <label data-i18n="form_image"></label>
      <input name="image" placeholder="🍽️" />
      <label data-i18n="form_status"></label>
      <select name="status">
        <option value="active" data-i18n="listed"></option>
        <option value="soldout" data-i18n="soldout"></option>
      </select>
      <p class="muted" id="msg"></p>
      <button class="btn btn-block" type="submit" style="margin-top:12px" id="submitBtn" data-i18n="form_add_product"></button>
    </form>
    <div class="grid" id="list" style="margin-top:16px"></div>
  </main>
  <nav class="bottom-nav">
    <a href="dashboard.html" data-i18n="nav_orders">訂單</a>
    <a class="active" href="menu.html" data-i18n="nav_menu">菜單</a>
  </nav>
  <script type="module" src="../js/pages/store-menu.js"></script>
</body>
</html>
