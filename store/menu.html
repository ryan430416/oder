<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="menu_manage">菜單管理</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/store.css" />
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="menu_manage">菜單管理</h1>
    <div class="topbar-actions">
      <div class="js-lang"></div>
      <span id="bellHost"></span>
      <button class="btn btn-ghost" id="logout" type="button" data-i18n="logout">登出</button>
      <a class="home-link" href="../index.html" data-i18n="home">首頁</a>
    </div>
  </header>
  <main class="wrap">
    <p class="sub" data-i18n="menu_manage_sub"></p>
    <form class="card login-form easy-form" id="form">
      <input type="hidden" name="product_id" />
      <label for="storeProductName" data-i18n="form_product_name"></label>
      <input id="storeProductName" name="product_name" maxlength="100" required />
      <label for="storeProductCategory" data-i18n="form_category"></label>
      <input id="storeProductCategory" name="category" maxlength="40" required />
      <label for="storeProductDescription" data-i18n="form_desc"></label>
      <textarea id="storeProductDescription" name="description" maxlength="500" rows="2"></textarea>
      <label for="storeProductPrice" data-i18n="form_price"></label>
      <input id="storeProductPrice" name="price" type="number" min="0" step="1" inputmode="numeric" required />
      <label for="storeProductPhoto" data-i18n="form_photo"></label>
      <input id="storeProductPhoto" type="file" accept="image/jpeg,image/png,image/webp" />
      <div id="photoPreview" class="image-preview" tabindex="0"></div>
      <progress id="uploadProgress" max="100" value="0" hidden></progress>
      <div class="row-actions">
        <button class="btn btn-ghost" type="button" id="removePhoto" hidden data-i18n="remove_photo"></button>
        <button class="btn btn-ghost" type="button" id="retryUpload" hidden data-i18n="retry"></button>
      </div>
      <label for="storeProductStatus" data-i18n="form_status"></label>
      <select id="storeProductStatus" name="status">
        <option value="active" data-i18n="listed"></option>
        <option value="soldout" data-i18n="soldout"></option>
        <option value="hidden" data-i18n="hidden"></option>
      </select>
      <p class="muted" id="msg"></p>
      <button class="btn btn-block" type="submit" style="margin-top:12px" id="submitBtn" data-i18n="form_add_product"></button>
      <button class="btn btn-ghost btn-block" type="button" id="cancelEdit" hidden data-i18n="cancel_edit"></button>
    </form>
    <div class="grid" id="list" style="margin-top:16px"></div>
  </main>
  <nav class="bottom-nav">
    <a href="dashboard.html" data-i18n="nav_orders">訂單</a>
    <a class="active" href="menu.html" data-i18n="nav_menu">菜單</a>
  </nav>
  <script type="module" src="../js/pages/store-menu.js"></script>
</body>
</html>
