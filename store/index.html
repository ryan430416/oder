<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="store_login">店家登入</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <div class="portal">
    <div class="js-lang"></div>
    <h1 data-i18n="store_login">店家登入</h1>
    <form class="login-form" id="form" method="post" action="#">
      <label for="storeUsername" data-i18n="username">帳號</label>
      <input id="storeUsername" name="username" autocomplete="username" required />
      <label for="storePassword" data-i18n="password">密碼</label>
      <input id="storePassword" name="password" type="password" autocomplete="current-password" required />
      <p class="muted" id="err"></p>
      <button class="btn btn-block" type="submit" style="margin-top:16px" data-i18n="login">登入</button>
    </form>
    <p><a href="forgot.html" data-i18n="forgot_pw"></a></p>
    <div class="hint" data-i18n="store_login_hint">store_a / store_b / store_c</div>
    <p><a href="../index.html" data-i18n="back_home">回入口</a></p>
  </div>
  <script type="module" src="../js/pages/store-login.js"></script>
</body>
</html>
