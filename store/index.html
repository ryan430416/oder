<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>店家登入</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <div class="portal">
    <h1>店家登入</h1>
    <form class="login-form" id="form">
      <label>帳號</label>
      <input name="username" autocomplete="username" required />
      <label>密碼</label>
      <input name="password" type="password" autocomplete="current-password" required />
      <p class="muted" id="err"></p>
      <button class="btn btn-block" type="submit" style="margin-top:16px">登入</button>
    </form>
    <div class="hint">store_a / store_b / store_c，密碼 1234。登入後系統從帳號綁定 store_id，前端不可改。</div>
    <p><a href="../index.html">回入口</a></p>
  </div>
  <script type="module" src="../js/pages/store-login.js"></script>
</body>
</html>
