<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="change_password">修改密碼</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <div class="portal">
    <div class="js-lang"></div>
    <h1 data-i18n="change_password">修改密碼</h1>
    <form class="login-form" id="form">
      <label for="currentPassword" data-i18n="current_password">目前密碼</label>
      <input id="currentPassword" name="current_password" type="password" autocomplete="current-password" required />
      <label for="newPassword" data-i18n="new_password">新密碼</label>
      <input id="newPassword" name="new_password" type="password" autocomplete="new-password" minlength="4" required />
      <label for="confirmPassword" data-i18n="confirm_password">確認新密碼</label>
      <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="4" required />
      <p class="muted" id="msg"></p>
      <button class="btn btn-block" type="submit" style="margin-top:16px" data-i18n="change_password">修改密碼</button>
    </form>
    <p><a href="dashboard.html" data-i18n="back">返回</a></p>
  </div>
  <script type="module" src="../js/pages/store-password.js"></script>
</body>
</html>
