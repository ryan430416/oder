<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="admin_stores">店家管理</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <header class="topbar">
    <a class="btn btn-ghost" href="dashboard.html" data-i18n="back">返回</a>
    <h1 data-i18n="admin_stores">店家管理</h1>
    <div class="topbar-actions">
      <div class="js-lang"></div>
      <button class="btn btn-ghost" id="logout" type="button" data-i18n="logout">登出</button>
      <a class="home-link" href="../index.html" data-i18n="home">首頁</a>
    </div>
  </header>
  <main class="wrap">
    <p class="sub" data-i18n="admin_stores_sub"></p>
    <form class="card login-form easy-form" id="form">
      <input type="hidden" name="store_id" />
      <label for="storeName" data-i18n="form_store_name"></label>
      <input id="storeName" name="store_name" required />
      <label for="storeDescription" data-i18n="form_desc"></label>
      <textarea id="storeDescription" name="description" rows="2"></textarea>
      <label data-i18n="form_open"></label>
      <div id="openPick"></div>
      <label data-i18n="form_close"></label>
      <div id="closePick"></div>
      <label data-i18n="form_image"></label>
      <div id="iconPick"></div>
      <div id="resetBox" hidden>
        <label for="newStorePassword" data-i18n="new_password"></label>
        <input id="newStorePassword" name="new_password" type="password" minlength="4" autocomplete="new-password" />
        <button class="btn btn-ghost btn-block" type="button" id="resetPw" style="margin-top:8px" data-i18n="reset_pw"></button>
      </div>
      <div id="loginFields">
        <label for="newStoreUsername" data-i18n="store_login_acc"></label>
        <input id="newStoreUsername" name="username" autocomplete="off" />
        <label for="newStoreLoginPassword" data-i18n="store_login_pwd"></label>
        <input id="newStoreLoginPassword" name="password" type="password" minlength="4" autocomplete="new-password" />
      </div>
      <p class="muted" id="msg"></p>
      <button class="btn btn-block" type="submit" style="margin-top:12px" id="submitBtn" data-i18n="form_add_store"></button>
      <button class="btn btn-ghost btn-block" type="button" id="cancelEdit" hidden data-i18n="cancel_edit"></button>
    </form>
    <div class="grid" id="list" style="margin-top:16px"></div>
  </main>
  <script type="module" src="../js/pages/admin-stores.js"></script>
</body>
</html>
