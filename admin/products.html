<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="admin_products">餐點管理</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <header class="topbar">
    <a class="btn btn-ghost" href="dashboard.html" data-i18n="back">返回</a>
    <h1 data-i18n="admin_products">餐點管理</h1>
    <div class="topbar-actions">
      <div class="js-lang"></div>
      <button class="btn btn-ghost" id="logout" type="button" data-i18n="logout">登出</button>
      <a class="home-link" href="../index.html" data-i18n="home">首頁</a>
    </div>
  </header>
  <main class="wrap">
    <p class="sub" data-i18n="admin_products_sub"></p>
    <label for="storePick" class="muted" data-i18n="pick_store"></label>
    <select id="storePick" class="search"></select>
    <form class="card login-form easy-form" id="form">
      <input type="hidden" name="product_id" />
      <label for="adminProductName" data-i18n="form_product_name"></label>
      <input id="adminProductName" name="product_name" required />
      <label for="adminProductCategory" data-i18n="form_category"></label>
      <input id="adminProductCategory" name="category" />
      <label for="adminProductDescription" data-i18n="form_desc"></label>
      <textarea id="adminProductDescription" name="description" rows="2"></textarea>
      <label for="adminProductPrice" data-i18n="form_price"></label>
      <input id="adminProductPrice" name="price" type="number" min="0" step="1" required />
      <label data-i18n="form_image"></label>
      <div id="iconPick"></div>
      <label for="adminProductStatus" data-i18n="form_status"></label>
      <select id="adminProductStatus" name="status">
        <option value="active" data-i18n="listed"></option>
        <option value="soldout" data-i18n="soldout"></option>
      </select>
      <p class="muted" id="msg"></p>
      <button class="btn btn-block" type="submit" style="margin-top:12px" id="submitBtn" data-i18n="form_add_product"></button>
    </form>
    <div class="grid" id="list" style="margin-top:16px"></div>
  </main>
  <script type="module" src="../js/pages/admin-products.js"></script>
</body>
</html>
